e="#171719" stroke-width="2.3"/><text x="288.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">기계는 못 속여.</text></svg><img src="images/02.webp" width="1536" height="1024" alt="두 시간 전 작업실. 딱지가 복제품 장갑의 보석을 소형 검사 장치에 대고 확인한다. 검사는 불일치. 진품은 공연장에 있으며 작업실에는 복제품 하나만 있다." loading="eager" decoding="async"></section><section class="cut medium" data-cut="3" style="margin-bottom:65px"><svg class="speech" viewBox="0 0 800 404" role="img" aria-label="찬호: 백억이면 손 씻을 때도 경비 붙겠네. / 원타치: 너는 손부터 씻어." xmlns="http://www.w3.org/2000/svg"><path d="M 188.0 166.47504291570527 L 200.0 205.47504291570527 L 212.0 166.47504291570527" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="335.0" cy="94.0" rx="311.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="335.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">백억이면 손 씻을 때도</text><text x="335.0" y="133.0" text-anchor="middle" font-size="41" font-weight="650">경비 붙겠네.</text><path d="M 564.0 336.9142735877573 L 576.0 375.9142735877573 L 588.0 336.9142735877573" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="506.0" cy="283.0" rx="270.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="506.0" y="297.0" text-anchor="middle" font-size="41" font-weight="650">너는 손부터 씻어.</text></svg><img src="images/03.webp" width="1536" height="1024" alt="찬호가 책상 건너 검사 결과를 보고, 원타치는 손보다 작은 장갑을 내려다본다. 딱지는 장갑을 보호 케이스 안에 다시 놓는다." loading="lazy" decoding="async"></section><section class="cut medium" data-cut="4" style="margin-bottom:65px"><span class="time">위장 취업 2주째.</span><svg class="speech" viewBox="0 0 800 454" role="img" aria-label="딱지: 난 회수 보조. 너희는 철수 인력. / 락스: 명단에 올린 이름으로만 불러." xmlns="http://www.w3.org/2000/svg"><path d="M 244.0 172.17912704333284 L 256.0 211.17912704333284 L 268.0 172.17912704333284" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="335.0" cy="94.0" rx="311.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="335.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">난 회수 보조. 너희는</text><text x="335.0" y="133.0" text-anchor="middle" font-size="41" font-weight="650">철수 인력.</text><path d="M 572.0 382.45530596331037 L 584.0 421.45530596331037 L 596.0 382.45530596331037" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="465.0" cy="308.0" rx="311.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="465.0" y="297.0" text-anchor="middle" font-size="41" font-weight="650">명단에 올린 이름으로만</text><text x="465.0" y="347.0" text-anchor="middle" font-size="41" font-weight="650">불러.</text></svg><img src="images/04.webp" width="1536" height="1024" alt="작업실 벽에 실제로 일해온 현장 사진 두 장과 장비 반출 작업표. 딱지는 등록된 가명·본인 사진의 당일 출입증, 찬호와 원타치는 하역 업무 출입증을 챙긴다. 보안 시스템을 해킹하는 화면은 없다." loading="lazy" decoding="async"></section><section class="cut wide" data-cut="5" style="margin-bottom:65px"><svg class="speech" viewBox="0 0 800 454" role="img" aria-label="락스: 너희 출입증은 하역장까지야. / 찬호: 그럼 물건이 밖으로 나올 때 받으면 되네." xmlns="http://www.w3.org/2000/svg"><path d="M 668.0 161.4069951134498 L 680.0 200.4069951134498 L 692.0 161.4069951134498" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="567.5" cy="94.0" rx="208.5" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="567.5" y="83.0" text-anchor="middle" font-size="41" font-weight="650">너희 출입증은</text><text x="567.5" y="133.0" text-anchor="middle" font-size="41" font-weight="650">하역장까지야.</text><path d="M 132.0 369.2224823606048 L 144.0 408.2224823606048 L 156.0 369.2224823606048" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="355.5" cy="308.0" rx="331.5" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="355.5" y="297.0" text-anchor="middle" font-size="41" font-weight="650">그럼 물건이 밖으로 나올</text><text x="355.5" y="347.0" text-anchor="middle" font-size="41" font-weight="650">때 받으면 되네.</text></svg><img src="images/05.webp" width="1536" height="1024" alt="보통 크기 책상 위 A4 사진 세 장을 락스가 나란히 놓는다. 장갑 회수실 문 사진, 서비스 통로 사진, 하역장 사진. 내부 지도 전체가 아닌 이미 관찰한 경계 세 곳. 찬호가 하역장 사진만 짚는다." loading="lazy" decoding="async"></section><section class="cut detail" data-cut="6" style="margin-bottom:65px"><svg class="speech" viewBox="0 0 800 504" role="img" aria-label="딱지: 검사 끝나면 내가 들고 나올게. 봉인 번호도 맞춰 놨어. / 찬호: 다시 감정받기 전에 빠지면 되겠네." xmlns="http://www.w3.org/2000/svg"><path d="M 244.0 221.35910583499935 L 256.0 260.35910583499935 L 268.0 221.35910583499935" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="335.0" cy="119.0" rx="311.0" ry="111.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="335.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">검사 끝나면 내가 들고</text><text x="335.0" y="133.0" text-anchor="middle" font-size="41" font-weight="650">나올게. 봉인 번호도</text><text x="335.0" y="183.0" text-anchor="middle" font-size="41" font-weight="650">맞춰 놨어.</text><path d="M 564.0 436.0594676811004 L 576.0 475.0594676811004 L 588.0 436.0594676811004" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="506.0" cy="358.0" rx="270.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="506.0" y="347.0" text-anchor="middle" font-size="41" font-weight="650">다시 감정받기 전에</text><text x="506.0" y="397.0" text-anchor="middle" font-size="41" font-weight="650">빠지면 되겠네.</text></svg><img src="images/06.webp" width="1536" height="1024" alt="복제품이 들어간 검정 하드 케이스 하나와 공연장 진품 운송 케이스 사진. 복제품 케이스의 종이 봉인 외형·일련번호는 미리 파악한 지급 기록에 맞췄지만, 장갑은 감정을 통과하지 못한다. 위조 제작법을 도해하지 않고 완성된 소품과 사진만 보여준다." loading="lazy" decoding="async"></section><section class="cut action" data-cut="7" style="margin-bottom:110px"><svg class="speech" viewBox="0 0 800 404" role="img" aria-label="찬호: 형, 잠깐만 혼자 잡아봐. / 원타치: 그 잠깐이 좀 긴데?" xmlns="http://www.w3.org/2000/svg"><path d="M 164.0 168.1615761486138 L 176.0 207.1615761486138 L 188.0 168.1615761486138" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="273.5" cy="94.0" rx="249.5" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="273.5" y="83.0" text-anchor="middle" font-size="41" font-weight="650">형, 잠깐만 혼자</text><text x="273.5" y="133.0" text-anchor="middle" font-size="41" font-weight="650">잡아봐.</text><path d="M 668.0 323.3095954018551 L 680.0 362.3095954018551 L 692.0 323.3095954018551" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="485.5" cy="283.0" rx="290.5" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="485.5" y="297.0" text-anchor="middle" font-size="41" font-weight="650">그 잠깐이 좀 긴데?</text></svg><img src="images/07.webp" width="1024" height="1536" alt="작업실의 실제 동작 연습. 원타치가 양손으로 큰 배경판 아래를 받쳐 가슴에 기대고 버틴다. 찬호는 옆에서 판을 놓아 두 손을 비운 상태로 주고받을 동작을 확인한다. 손잡이를 순간 새로 생성하지 않는다." loading="lazy" decoding="async"></section><section class="cut medium" data-cut="8" style="margin-bottom:130px"><svg class="speech" viewBox="0 0 800 354" role="img" aria-label="원타치: 끝나면 치킨이다. / 뻐꾸기: 누가 사는데요?" xmlns="http://www.w3.org/2000/svg"><path d="M 404.0 125.0 L 416.0 164.0 L 428.0 125.0" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="416.0" cy="69.0" rx="249.5" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="416.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">끝나면 치킨이다.</text><path d="M 532.0 289.0 L 544.0 328.0 L 556.0 289.0" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="544.0" cy="233.0" rx="229.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="544.0" y="247.0" text-anchor="middle" font-size="41" font-weight="650">누가 사는데요?</text></svg><img src="images/08.webp" width="1536" height="1024" alt="밴에서 출발 준비. 운전석 락스, 조수석 딱지, 뒤의 찬호·원타치·뻐꾸기. 뻐꾸기는 정상 반출 작업표를 확인하고, 락스는 노란 보호 범퍼를 씌운 별도 업무용 휴대전화를 대시보드 거치대에 둔다. 해당 연락처는 팀이 등록한 용역업체 현장 연락처다. 음식·배달 가방은 없다." loading="lazy" decoding="async"></section><section class="cut wide" data-cut="9" style="margin-bottom:65px"><span class="time">공연장 하역장</span><div class="narration">공연 종료 전.</div><img src="images/09.webp" width="1536" height="1024" alt="밤 공연장 하역장 전경. 정상 철수 물품인 큰 배경판과 장비 케이스가 있다. 찬호·원타치는 하역 구획, 뻐꾸기는 반출 접수대, 딱지는 직원 출입 확인대로 나뉜다. CCTV와 경비를 작지만 분명하게 포함." loading="lazy" decoding="async"></section><section class="cut medium" data-cut="10" style="margin-bottom:65px"><svg class="speech" viewBox="0 0 800 240" role="img" aria-label="직원: 명단 맞습니다. 안에서 대기해 주세요." xmlns="http://www.w3.org/2000/svg"><path d="M 100.00000000000001 148.944594511443 L 112.00000000000001 187.944594511443 L 124.00000000000001 148.944594511443" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="335.0" cy="94.0" rx="311.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="335.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">명단 맞습니다. 안에서</text><text x="335.0" y="133.0" text-anchor="middle" font-size="41" font-weight="650">대기해 주세요.</text></svg><img src="images/10.webp" width="1536" height="1024" alt="직원이 딱지의 사진 출입증과 등록 명단을 대조한다. 딱지는 원래 단발·금 귀걸이·버건디 재킷·아이보리 상의·검정 바지 유지. 담당 보안요원이 안쪽으로 동행한다." loading="lazy" decoding="async"></section><section class="cut wide" data-cut="11" style="margin-bottom:65px"><svg class="speech" viewBox="0 0 800 404" role="img" aria-label="담당자: 두 분은 여기까지만요. / 담당자: 판만 가져가세요. 보관대는 두고요." xmlns="http://www.w3.org/2000/svg"><path d="M 660.0 109.52510912723574 L 672.0 148.52510912723574 L 684.0 109.52510912723574" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="465.0" cy="69.0" rx="311.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="465.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">두 분은 여기까지만요.</text><path d="M 660.0 322.8623385121352 L 672.0 361.8623385121352 L 684.0 322.8623385121352" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="526.5" cy="258.0" rx="249.5" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="526.5" y="247.0" text-anchor="middle" font-size="41" font-weight="650">판만 가져가세요.</text><text x="526.5" y="297.0" text-anchor="middle" font-size="41" font-weight="650">보관대는 두고요.</text></svg><img src="images/11.webp" width="1536" height="1024" alt="하역 담당자가 두 남자의 작업증을 대조한 뒤 경계선 안쪽을 막고 정상 철수 배경판 한 장을 가리킨다. 여러 판을 꽂은 보관대는 공연장 소유로 여기에 남는다. 두 사람은 허용 구획 안에서 판만 받는다." loading="lazy" decoding="async"></section><section class="cut detail" data-cut="12" style="margin-bottom:100px"><svg class="speech" viewBox="0 0 800 354" role="img" aria-label="담당자: 뒷장도 작성해 주세요. / 뻐꾸기: 뒤에도 있어요?" xmlns="http://www.w3.org/2000/svg"><path d="M 612.0 116.42520880820965 L 624.0 155.42520880820965 L 636.0 116.42520880820965" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="465.0" cy="69.0" rx="311.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="465.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">뒷장도 작성해 주세요.</text><path d="M 188.0 287.3437847513924 L 200.0 326.3437847513924 L 212.0 287.3437847513924" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="253.0" cy="233.0" rx="229.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="253.0" y="247.0" text-anchor="middle" font-size="41" font-weight="650">뒤에도 있어요?</text></svg><img src="images/12.webp" width="1536" height="1024" alt="접수대. 뻐꾸기가 정상 장비 반출 작업표를 제출하자 담당자가 종이를 뒤집어 남은 기입란을 가리킨다. 뻐꾸기는 잠깐 당황한 얼굴로 펜을 다시 잡는다." loading="lazy" decoding="async"></section><section class="cut wide" data-cut="13" style="margin-bottom:65px"><span class="time">회수실</span><svg class="speech" viewBox="0 0 800 404" role="img" aria-label="가수: 피아노는 맨손으로 쳐야겠네요. / 책임자: 네. 여기로 주세요." xmlns="http://www.w3.org/2000/svg"><path d="M 172.0 169.2763729063778 L 184.0 208.2763729063778 L 196.0 169.2763729063778" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="273.5" cy="94.0" rx="249.5" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="273.5" y="83.0" text-anchor="middle" font-size="41" font-weight="650">피아노는 맨손으로</text><text x="273.5" y="133.0" text-anchor="middle" font-size="41" font-weight="650">쳐야겠네요.</text><path d="M 420.0 339.0 L 432.0 378.0 L 444.0 339.0" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="432.0" cy="283.0" rx="290.5" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="432.0" y="297.0" text-anchor="middle" font-size="41" font-weight="650">네. 여기로 주세요.</text></svg><img src="images/13.webp" width="1536" height="1024" alt="독립된 회수 준비 공간. 가수는 오른손 장갑 착용. 별도의 의상 담당자(검정 단발·네이비 폴로)는 재킷을 준비한다. 귀중품 책임자(머리 묶은 여성·차콜 정장·흰 취급 장갑)가 열린 맞춤 하드 케이스를 두 손으로 받치고, 딱지는 옆에서 대기. 정장 경비 입회." loading="lazy" decoding="async"></section><section class="cut detail" data-cut="14" style="margin-bottom:65px"><img src="images/14.webp" width="1536" height="1024" alt="같은 회수실. 마이크는 벤치에 내려놓아 양손으로 장갑을 벗을 수 있었다. 이제 가수의 맨 오른손이 벗은 진품 장갑을 책임자의 흰 두 손이 받치는 열린 케이스 맞춤 보호 홈으로 직접 넣는다. 진품은 한 짝이며 보석도 거기에만 있다." loading="lazy" decoding="async"></section><section class="cut detail" data-cut="15" style="margin-bottom:65px"><img src="images/15.webp" width="1536" height="1024" alt="같은 회수실 검사대의 진품 확인. 책임자가 보호 홈에 놓인 보석을 장치로 확인한다. 딱지와 동행 경비가 지켜본다. 진품 결과는 확인." loading="lazy" decoding="async"></section><section class="cut medium" data-cut="16" style="margin-bottom:130px"><svg class="speech" viewBox="0 0 800 454" role="img" aria-label="책임자: 차량 인계까지 동행하세요. / 경비: 네. 제가 따라가겠습니다." xmlns="http://www.w3.org/2000/svg"><path d="M 188.0 173.94879976361563 L 200.0 212.94879976361563 L 212.0 173.94879976361563" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="232.5" cy="94.0" rx="208.5" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="232.5" y="83.0" text-anchor="middle" font-size="41" font-weight="650">차량 인계까지</text><text x="232.5" y="133.0" text-anchor="middle" font-size="41" font-weight="650">동행하세요.</text><path d="M 676.0 370.76495698885844 L 688.0 409.76495698885844 L 700.0 370.76495698885844" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="547.0" cy="308.0" rx="229.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="547.0" y="297.0" text-anchor="middle" font-size="41" font-weight="650">네. 제가</text><text x="547.0" y="347.0" text-anchor="middle" font-size="41" font-weight="650">따라가겠습니다.</text></svg><img src="images/16.webp" width="1536" height="1024" alt="책임자가 닫아 봉인한 케이스를 딱지에게 직접 인계한다. 경비가 바로 뒤에 선다. 운송 전 봉인 대조·정밀 검사는 유효하다." loading="lazy" decoding="async"></section><section class="cut wide" data-cut="17" style="margin-bottom:30px"><img src="images/17.webp" width="1536" height="1024" alt="이동 접점 전경. 딱지는 진품 케이스를 왼손에 들고 서비스 통로에서 하역장 쪽으로 온다. 경비가 한 걸음 뒤. 찬호·원타치는 허용 구획에서 보관대에서 뺀 배경판 양쪽을 잡고 있다. 찬호 바로 옆 열린 큰 은회색 공구 운송함 안에 닫힌 가품 케이스가 미리 보인다. 은회색 운송함은 정상 철수 물품이며 판 보관대와 다른 소품이다." loading="lazy" decoding="async"></section><section class="cut medium" data-cut="18" style="margin-bottom:20px"><svg class="speech" viewBox="0 0 800 240" role="img" aria-label="경비: 잠깐만요. 먼저 지나가겠습니다." xmlns="http://www.w3.org/2000/svg"><path d="M 604.0 171.00325516158824 L 616.0 210.00325516158824 L 628.0 171.00325516158824" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="547.0" cy="94.0" rx="229.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="547.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">잠깐만요. 먼저</text><text x="547.0" y="133.0" text-anchor="middle" font-size="41" font-weight="650">지나가겠습니다.</text></svg><img src="images/18.webp" width="1536" height="1024" alt="경비가 배경판 이동을 보고 먼저 통과하겠다고 손짓한다. 두 남자는 멈추고, 딱지는 케이스를 계속 들고 있다." loading="lazy" decoding="async"></section><section class="cut action" data-cut="19" style="margin-bottom:12px"><svg class="speech" viewBox="0 0 800 190" role="img" aria-label="원타치: 놔. 내가 잡았어." xmlns="http://www.w3.org/2000/svg"><path d="M 652.0 113.46488078149005 L 664.0 152.46488078149005 L 676.0 113.46488078149005" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="506.0" cy="69.0" rx="270.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="506.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">놔. 내가 잡았어.</text></svg><img src="images/19.webp" width="1536" height="1024" alt="원타치가 준비 때처럼 양손으로 배경판 아래를 받쳐 무게를 전부 지지한다. 찬호는 왼손을 비우고 오른손으로 바로 옆 열린 은회색 운송함의 가품 케이스를 들어 올린다. 판이 경비와 딱지 손 사이를 잠시 가린다." loading="lazy" decoding="async"></section><section class="cut detail" data-cut="20" style="margin-bottom:8px"><img src="images/20.webp" width="1536" height="1024" alt="판 뒤의 손만. 딱지 왼손은 진품 케이스를 계속 잡는다. 딱지 오른손이 찬호 오른손의 가품 케이스 손잡이를 받는다. 찬호 왼손은 아직 비어 있다. 버건디·네이비 소매로 구분한다." loading="lazy" decoding="async"></section><section class="cut detail" data-cut="21" style="margin-bottom:8px"><img src="images/21.webp" width="1536" height="1024" alt="카메라가 딱지 등 뒤의 손 쪽으로 이동한다. 딱지 오른손은 가품 케이스를 계속 들고, 왼손의 진품을 찬호의 정상 오른손에 넘긴다. 두 케이스는 분리되고 닫혀 있다." loading="lazy" decoding="async"></section><section class="cut action" data-cut="22" style="margin-bottom:35px"><img src="images/22.webp" width="1536" height="1024" alt="찬호가 받은 진품 케이스를 양손으로 옮겨 같은 은회색 공구 운송함에 넣는다. 실제 그림에서는 왼손이 작은 케이스 손잡이를 잡고 오른손이 큰 함 뚜껑을 지지한다. 원타치는 판을 계속 단독 지지한다." loading="lazy" decoding="async"></section><section class="cut medium" data-cut="23" style="margin-bottom:90px"><svg class="speech" viewBox="0 0 800 404" role="img" aria-label="경비: 잠시만요. 케이스가 가려져서요. / 경비: 재검사받고 가시죠." xmlns="http://www.w3.org/2000/svg"><path d="M 556.0 172.70191541845855 L 568.0 211.70191541845855 L 580.0 172.70191541845855" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="506.0" cy="94.0" rx="270.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="506.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">잠시만요. 케이스가</text><text x="506.0" y="133.0" text-anchor="middle" font-size="41" font-weight="650">가려져서요.</text><path d="M 556.0 337.3699632619299 L 568.0 376.3699632619299 L 580.0 337.3699632619299" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="506.0" cy="283.0" rx="270.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="506.0" y="297.0" text-anchor="middle" font-size="41" font-weight="650">재검사받고 가시죠.</text></svg><img src="images/23.webp" width="1536" height="1024" alt="판 가장자리를 돌아와 딱지의 가품 케이스를 다시 본 경비가 멈춘다. 손이 가려진 일을 그냥 넘기지 않고 회수실 방향을 가리킨다. 딱지는 눈빛만 굳는다." loading="lazy" decoding="async"></section><section class="cut close" data-cut="24" style="margin-bottom:110px"><svg class="speech" viewBox="0 0 800 190" role="img" aria-label="딱지: 네. 바로 가시죠." xmlns="http://www.w3.org/2000/svg"><path d="M 348.0 125.0 L 360.0 164.0 L 372.0 125.0" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="360.0" cy="69.0" rx="270.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="360.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">네. 바로 가시죠.</text></svg><img src="images/24.webp" width="1024" height="1536" alt="딱지는 가품 케이스를 놓지 않은 채 경비를 보고 고개를 끄덕인다. 손은 공개돼 있고 이어폰을 만지거나 범행 말을 하지 않는다." loading="lazy" decoding="async"></section><section class="cut medium" data-cut="25" style="margin-bottom:25px"><span class="time">하역장</span><svg class="speech" viewBox="0 0 800 190" role="img" aria-label="담당자: 네, 반출하셔도 됩니다." xmlns="http://www.w3.org/2000/svg"><path d="M 596.0 117.06443477158899 L 608.0 156.064434771589 L 620.0 117.06443477158899" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="444.5" cy="69.0" rx="331.5" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="444.5" y="83.0" text-anchor="middle" font-size="41" font-weight="650">네, 반출하셔도 됩니다.</text></svg><img src="images/25.webp" width="1536" height="1024" alt="하역 접수 담당자가 실제 반출 확인을 끝내고 서류를 뻐꾸기에게 돌려준다. 문 너머 락스의 밴이 작업 위치에 대기한다. 아직 경보가 접수되지 않았다." loading="lazy" decoding="async"></section><section class="cut action" data-cut="26" style="margin-bottom:110px"><svg class="speech" viewBox="0 0 800 190" role="img" aria-label="뻐꾸기: 뒤쪽, 조금만 더요." xmlns="http://www.w3.org/2000/svg"><path d="M 92.0 106.0385332395607 L 104.0 145.0385332395607 L 116.0 106.0385332395607" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="314.5" cy="69.0" rx="290.5" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="314.5" y="83.0" text-anchor="middle" font-size="41" font-weight="650">뒤쪽, 조금만 더요.</text></svg><img src="images/26.webp" width="1536" height="1024" alt="밴 적재. 원타치는 같은 남색·아이보리 배경판을 밴 뒤 화물 공간 옆면으로 밀어 넣고, 찬호는 닫힌 은회색 공구 운송함을 적재턱으로 밀어 올린다. 뻐꾸기는 완료된 반출 작업표를 쥐고 안내한다. 다같은 정상 철수 동작 안에서 진품도 밖으로 나간다. CCTV는 차량과 작업자를 계속 기록한다." loading="lazy" decoding="async"></section><section class="cut detail" data-cut="27" style="margin-bottom:25px"><span class="time">회수실</span><svg class="speech" viewBox="0 0 800 190" role="img" aria-label="책임자: 가짜예요." xmlns="http://www.w3.org/2000/svg"><path d="M 212.00000000000003 125.0 L 224.00000000000003 164.0 L 236.00000000000003 125.0" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="224.00000000000003" cy="69.0" rx="167.5" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="224.00000000000003" y="83.0" text-anchor="middle" font-size="41" font-weight="650">가짜예요.</text></svg><img src="images/27.webp" width="1536" height="1024" alt="회수실. 책임자가 되돌아온 가품 케이스를 열어 맞춤 보호 홈의 장갑 보석을 다시 검사한다. 동일한 의미의 붉은 실패 표시. 겉보기 봉인 번호는 같았지만 보석은 가짜다. 딱지와 경비가 결과를 함께 본다." loading="lazy" decoding="async"></section><section class="cut medium" data-cut="28" style="margin-bottom:25px"><svg class="speech" viewBox="0 0 800 240" role="img" aria-label="경비: 방금 운반팀, 출구 확인해 주세요." xmlns="http://www.w3.org/2000/svg"><path d="M 644.0 160.50723005834644 L 656.0 199.50723005834644 L 668.0 160.50723005834644" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="506.0" cy="94.0" rx="270.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="506.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">방금 운반팀, 출구</text><text x="506.0" y="133.0" text-anchor="middle" font-size="41" font-weight="650">확인해 주세요.</text></svg><img src="images/28.webp" width="1536" height="1024" alt="경비가 출입문 쪽을 막고 동료에게 무전한다. 딱지 앞의 케이스는 책임자가 확보한다. 소란 속에서도 물건·사람 통제를 분리한다." loading="lazy" decoding="async"></section><section class="cut wide" data-cut="29" style="margin-bottom:100px"><span class="time">관제실</span><svg class="speech" viewBox="0 0 800 240" role="img" aria-label="관제: 차량 확인하고 출구 통제하세요." xmlns="http://www.w3.org/2000/svg"><path d="M 164.0 166.3521418875737 L 176.0 205.3521418875737 L 188.0 166.3521418875737" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="294.0" cy="94.0" rx="270.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="294.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">차량 확인하고 출구</text><text x="294.0" y="133.0" text-anchor="middle" font-size="41" font-weight="650">통제하세요.</text></svg><img src="images/29.webp" width="1536" height="1024" alt="관제 화면에는 배경판에 손이 잠깐 가려졌던 실제 하역 장면과 찬호·원타치의 얼굴, 출고 차량이 보인다. 근무자들이 출입 기록과 차량을 확인한다." loading="lazy" decoding="async"></section><section class="cut wide" data-cut="30" style="margin-bottom:70px"><span class="time">하역장 밖</span><svg class="speech" viewBox="0 0 800 354" role="img" aria-label="락스: 딱지는? / 찬호: 아직 안 나왔어요." xmlns="http://www.w3.org/2000/svg"><path d="M 644.0 122.68757453634183 L 656.0 161.68757453634183 L 668.0 122.68757453634183" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="611.0" cy="69.0" rx="165.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="611.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">딱지는?</text><path d="M 252.0 288.6222873899943 L 264.0 327.6222873899943 L 276.0 288.6222873899943" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="294.0" cy="233.0" rx="270.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="294.0" y="247.0" text-anchor="middle" font-size="41" font-weight="650">아직 안 나왔어요.</text></svg><img src="images/30.webp" width="1536" height="1024" alt="아직 하역장 가까운 외부 대기 지점. 밴은 정차. 락스 운전, 뒤의 찬호·원타치·뻐꾸기. 딱지가 출발 때 앉았던 앞 조수석 하나가 비어 있다. 실제 장비와 배경판은 분리된 뒤 화물 공간에 실렸다." loading="lazy" decoding="async"></section><section class="cut detail" data-cut="31" style="margin-bottom:18px"><img src="images/31.webp" width="1536" height="1024" alt="밴 화물칸. 찬호가 같은 큰 은회색 공구 운송함을 열고 그 안의 진품 보호 케이스를 잠깐 열어 확인한다. 두 손은 정상이며 웃지 않는다." loading="lazy" decoding="async"></section><section class="cut close" data-cut="32" style="margin-bottom:100px"><svg class="speech" viewBox="0 0 800 240" role="img" aria-label="찬호: 출발하지 마요. 딱지 두곤 못 가요." xmlns="http://www.w3.org/2000/svg"><path d="M 348.0 175.0 L 360.0 214.0 L 372.0 175.0" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="360.0" cy="94.0" rx="290.5" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="360.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">출발하지 마요. 딱지</text><text x="360.0" y="133.0" text-anchor="middle" font-size="41" font-weight="650">두곤 못 가요.</text></svg><img src="images/32.webp" width="1024" height="1536" alt="찬호가 작은 진품 보호 케이스를 닫아 운송함에서 꺼내고 락스 쪽을 보며 말한다. 양손으로 케이스를 안전하게 잡고 차량은 아직 정차 중이다." loading="lazy" decoding="async"></section><section class="cut medium" data-cut="33" style="margin-bottom:130px"><svg class="speech" viewBox="0 0 800 240" role="img" aria-label="경비: 업체 책임자 연결해 주세요." xmlns="http://www.w3.org/2000/svg"><path d="M 644.0 160.50723005834644 L 656.0 199.50723005834644 L 668.0 160.50723005834644" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="506.0" cy="94.0" rx="270.0" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="506.0" y="83.0" text-anchor="middle" font-size="41" font-weight="650">업체 책임자 연결해</text><text x="506.0" y="133.0" text-anchor="middle" font-size="41" font-weight="650">주세요.</text></svg><img src="images/33.webp" width="1536" height="1024" alt="회수실. 딱지는 경비 앞 의자에 남아 있다. 경비가 업체 근무 명단의 연락처를 짚고 제복 직원이 유선 전화로 확인 전화를 건다. 중복 CCTV 모니터는 실제 그림 검수에서 제거했다." loading="lazy" decoding="async"></section><section class="cut splash" data-cut="34" style="margin-bottom:160px"><svg class="speech" viewBox="0 0 800 404" role="img" aria-label="찬호: 받아요. 딱지 데려와야죠. / 락스: 네, 현장 담당입니다." xmlns="http://www.w3.org/2000/svg"><path d="M 219.99999999999997 174.99975271545745 L 231.99999999999997 213.99975271545745 L 243.99999999999997 174.99975271545745" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="232.5" cy="94.0" rx="208.5" ry="86.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="232.5" y="83.0" text-anchor="middle" font-size="41" font-weight="650">받아요. 딱지</text><text x="232.5" y="133.0" text-anchor="middle" font-size="41" font-weight="650">데려와야죠.</text><path d="M 612.0 330.4252088082096 L 624.0 369.4252088082096 L 636.0 330.4252088082096" fill="white" stroke="#171719" stroke-width="2.3"/><ellipse cx="465.0" cy="283.0" rx="311.0" ry="61.0" fill="white" stroke="#171719" stroke-width="2.3"/><text x="465.0" y="297.0" text-anchor="middle" font-size="41" font-weight="650">네, 현장 담당입니다.</text></svg><img src="images/34.webp" width="1024" height="1536" alt="큰 세로 밴 내부 컷. 앞유리 밖 멀리 보안 인력이 움직인다. 락스 앞 대시보드의 준비 때의 노란 범퍼 업무 전화가 실제로 울려 락스가 받는다. 찬호는 뒤에서 몸을 기울여, 닫혀 보호된 진품 케이스를 딱지가 앉아야 할 빈 앞 조수석 위에 안전하게 놓고 락스를 본다. 원타치·뻐꾸기는 뒤에서 조용히 지켜본다. 아무도 다시 출입구로 닥돌하지 않는다." loading="lazy" decoding="async"></section></main><footer>다음 화에 계속 · <a href="production.html">제작·검수 기록</a></footer></html>
