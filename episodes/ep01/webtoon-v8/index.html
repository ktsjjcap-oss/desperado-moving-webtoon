<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="DESPERADO — 백억짜리 장갑, 다섯 명의 잠입과 귀환. 정지 웹툰 v8."><title>DESPERADO · 백억짜리 한 손 · 웹툰 v8</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#10151c;color:#ece9e3;font:16px/1.7 system-ui,sans-serif}header,footer{max-width:760px;margin:auto;padding:40px 22px}h1{font-size:36px;line-height:1.25;margin:12px 0}p{margin:10px 0}.brand{font-size:12px;color:#c6aa7d;letter-spacing:.13em}a{color:inherit}main{max-width:760px;margin:auto;background:#fff}section{margin:0;padding:0;line-height:0;scroll-margin-top:16px}section img{display:block;width:100%;height:auto;cursor:zoom-in}nav{display:flex;gap:18px;flex-wrap:wrap;margin-top:24px;font-size:14px}.top{position:fixed;right:15px;bottom:16px;border:1px solid #59616e;border-radius:30px;background:#26303c;padding:7px 13px;text-decoration:none;font-size:13px}.hint{font-size:12px;color:#9fa8b6}dialog{border:0;padding:0;background:#10151c;color:white;max-width:98vw;max-height:94vh;width:1100px}dialog::backdrop{background:#000d}.controls{position:sticky;top:0;background:#17212e;padding:8px;display:flex;gap:12px;align-items:center;z-index:3}button{font:inherit;border:1px solid #657083;background:#283548;color:white;border-radius:5px;padding:6px 12px;cursor:pointer}.zoom{overflow:auto;max-height:82vh;touch-action:pan-x pan-y}.zoom img{display:block;width:100%;max-width:none}.status{font-size:12px;color:#afb9c8}@media(max-width:480px){header,footer{padding:28px 18px}h1{font-size:29px}.controls{font-size:13px;gap:6px}button{padding:6px 8px}}</style><body><header id="top"><span class="brand">DESPERADO · COMEDY HEIST</span><h1>백억짜리 한 손</h1><p>장갑 하나 훔치러 왔다.<br>치킨은 고객님 거였다.</p><nav><a href="#page-1">읽기 시작</a><a href="review.html">제작·검수 기록</a></nav><p class="hint">그림을 누르면 크게 볼 수 있습니다.</p></header><main><section id="page-1" aria-label="1~3컷"><img src="assets/01.webp" width="1024" height="1536" alt="공연장 왼쪽, 주차장 오른쪽. 밤비가 막 그쳤고 옥상 정비 다리와 아래 도로가 함께 보인다. / 젊은 가수가 오른손 보석 장갑을 들고 노래한다. 관객과 무대 규모를 보여준다. / 검은 오른손 장갑의 중심 핑크 다이아. 손가락은 정상이며 보석은 하나." loading="eager" decoding="async" tabindex="0" data-page="1"></section><section id="page-2" aria-label="4~6컷"><img src="assets/02.webp" width="1024" height="1536" alt="락스가 사진을 뒤로 건넨다. 다섯 얼굴을 한 번만 동시에 보여주고 인물명 자막을 처음 한 번 붙인다. / 딱지가 사진을 받고 핑크 보석을 짚는다. / 락스 손이 보석 부분을 짚고 찬호는 원타치의 큰 손과 사진을 비교한다." loading="eager" decoding="async" tabindex="0" data-page="2"></section><section id="page-3" aria-label="7~9컷"><img src="assets/03.webp" width="1024" height="1536" alt="펼친 공연장 서비스 구역 도면에 직원 입구·휴게실·후문·계단·B1 점검로·B2 금고실이 표시된다. 사진과 장비는 탁자 위. / 딱지가 주문 영수증 &#x27;운영팀 / 김성준 / 치킨 2상자&#x27;와 치킨용 흰 비닐봉투를 확인한다. / 찬호가 도면의 후문 골목을 짚고 원타치는 작은 하강 가방을 어깨에 멘다." loading="lazy" decoding="async" tabindex="0" data-page="3"></section><section id="page-4" aria-label="10~12컷"><img src="assets/04.webp" width="1024" height="1536" alt="뻐꾸기가 카메라 가방을 들다 무거워 휘청한다. 옆 포켓에 큰 삼각대, 별도 작은 배터리 주머니. / 찬호가 허리·다리 하네스와 줄, 보호 케이스를 순서대로 넣는다. 원타치는 모양·무게가 같은 복제 장갑을 작은 벨벳 주머니에 넣는다. / 락스가 운송차 도착시간과 차량번호가 적힌 메모를 본 뒤 모두 하차할 준비를 한다. 딱지가 젓가락을 봉투에 넣는다." loading="lazy" decoding="async" tabindex="0" data-page="4"></section><section id="page-5" aria-label="13~15컷"><img src="assets/05.webp" width="1024" height="1536" alt="딱지의 치킨용 흰 비닐봉투, 직원 출입구 표찰, 경비 데스크가 함께 보인다. 정면 관객 검색대는 별도 입구다. / 딱지가 김 대리 주문 내역을 확인하며 전화한다. / 김 대리가 출입증을 경비에게 보이고 딱지를 안쪽으로 안내한다." loading="lazy" decoding="async" tabindex="0" data-page="5"></section><section id="page-6" aria-label="16~19컷"><img src="assets/06.webp" width="1024" height="1536" alt="입구를 등지고 안으로 보면 왼쪽 휴게실, 앞쪽 후문, 오른쪽 꺾인 직원 계단. 휴게실 문에서 후문 밖은 안 보이고, 정면 검색대는 모퉁이 너머다. / 딱지가 봉투에서 치킨 두 상자를 꺼내 탁자에 놓는다. 같은 봉투에서 포장 젓가락과 소스도 건넨다. 빈 봉투는 딱지가 접는다. / 찬호·원타치는 후문 정면이 아닌 옆 벽의 그늘에 대기한다. 손잡이 없는 외부 철문과 &#x27;후문&#x27; 표찰이 보인다. / 찬호가 수신기를 누르며 문을 살피고 원타치는 발을 옮기려다 멈춘다." loading="lazy" decoding="async" tabindex="0" data-page="6"></section><section id="page-7" aria-label="20~23컷"><img src="assets/07.webp" width="1024" height="1536" alt="뻐꾸기가 관객 줄 앞에 선다. 안내판에 &#x27;대형 삼각대 반입 불가&#x27;가 있고 계단 쪽 직원 문을 가까이 보여준다. / 카메라·큰 삼각대·배터리 주머니가 탁자 위에 나온다. 뻐꾸기는 접으려다 반대로 펼친다. / 뻐꾸기가 삼각대에 달린 &#x27;접는 법&#x27; 종이를 뒤집어 보며 우물거린다. 뒤 줄이 밀리고 책임자가 별도 검사대를 펴고 있다. / 책임자가 추가 검사대를 열면서 김 대리를 먼저 부른다." loading="lazy" decoding="async" tabindex="0" data-page="7"></section><section id="page-8" aria-label="24~28컷"><img src="assets/08.webp" width="1024" height="1536" alt="김 대리가 젓가락을 막 뜯으려다 무전을 듣고 내려놓는다. 딱지는 빈 봉투를 든 채 있다. / 김 대리가 정면 쪽 모퉁이로 간다. 딱지는 휴게실 문 안에서 기다리는 척한다. / 딱지가 모퉁이가 빈 것을 본 뒤 후문을 안쪽에서 연다. 문날개가 벽 쪽으로 열리고 남자들은 바깥 그늘에 있다. / 원타치가 먼저, 찬호가 뒤로 문턱을 넘는다. 딱지는 문을 잡는다. 골목·문턱·꺾인 계단을 함께 보여준다. / 두 남자가 계단 벽 뒤로 빠진 뒤 딱지가 문을 조용히 닫는다. 외부 잠금 철컥이 나고 휴게실 쪽은 여전히 비어 있다." loading="lazy" decoding="async" tabindex="0" data-page="8"></section><section id="page-9" aria-label="29~33컷"><img src="assets/09.webp" width="1024" height="1536" alt="검색 책임자가 길어진 줄을 나누도록 직원 문 쪽 경비 둘을 부른다. 경비들이 실제로 직원 문을 나와 정면 검사대로 이동한다. / 찬호·원타치가 문 안쪽 대기 지점에서 무전을 듣고 내려간다. / 김 대리가 휴게실에 돌아와 기다리던 딱지와 함께 직원 출입구로 걸어간다. 딱지 손에는 빈 흰 비닐봉투가 있다. / 경비가 접힌 삼각대와 가방을 뻐꾸기에게 돌려준다. 뻐꾸기는 관객석에 들어가지 않고 자진 귀가한다. / 딱지와 뻐꾸기가 밴에 돌아온다. 락스는 운전석에서 직원 차량 진입로를 보고 있다. 빈 치킨 봉투는 앞좌석 아래, 장비가방은 뒤쪽." loading="lazy" decoding="async" tabindex="0" data-page="9"></section><section id="page-10" aria-label="34~36컷"><img src="assets/10.webp" width="1024" height="1536" alt="계단은 아래로 향하며 B1을 지나 B2 표찰 앞에 도착한다. 앞쪽 방은 금고실, 왼쪽 뒤로 올라가는 서비스 계단이 연결된다. / 금고실 밖에 별도 경비 둘이 남아 있다. 찬호·원타치는 계단 코너 뒤에서 보며 노출되지 않는다. / 원타치가 뒤로 물러나 B1 기술 통로로 향한다. 찬호가 P06 도면과 같은 표찰을 보고 따라간다." loading="lazy" decoding="async" tabindex="0" data-page="10"></section><section id="page-11" aria-label="37~39컷"><img src="assets/11.webp" width="1024" height="1536" alt="무대 아래 기술 통로에서 금고실 천장 위 점검 발판으로 이어진다. 오른쪽 서비스 계단은 옥상까지, 발판 아래가 B2 금고실. 무대 빛은 틈으로만 들어온다. / 두 사람이 하네스와 이동 중 안전줄을 고정 구조물에 연결한다. 별도 장갑 보호 케이스는 찬호 허리 안쪽에 있다. / 작은 점검 덮개 아래로 내부를 본다. 찬호는 뚜껑만 조금 열고 움직임을 멈춘다. 바닥·받침·외부 문·카메라·회수 사다리를 한 공간에 보여준다." loading="lazy" decoding="async" tabindex="0" data-page="11"></section><section id="page-12" aria-label="40~43컷"><img src="assets/12.webp" width="1024" height="1536" alt="앙코르가 끝나고 의상 담당자가 가수의 오른손 장갑을 벗겨 벨벳 운송 케이스에 넣는다. / 담당자가 운송 케이스에서 장갑을 꺼내 중앙 받침에 놓고 투명 덮개를 닫는다. 벽 카메라는 작동하고 녹화 표시등이 켜져 있다. / 담당자 손이 &#x27;인계 검사&#x27; 스위치를 누른다. 덮개 옆 작은 황색 등이 느리게 깜빡인다. 담당자는 문을 닫고 밖 경비에게 합류한다. / 찬호가 담당자 퇴실과 문이 닫힌 것을 직접 확인하고 무전한다." loading="lazy" decoding="async" tabindex="0" data-page="12"></section><section id="page-13" aria-label="44~48컷"><img src="assets/13.webp" width="1024" height="1536" alt="찬호가 준비 도면의 센서 표시와 아래 받침을 대조한다. 벽 카메라도 확인하고 원타치가 회수 줄을 잡는다. / 원타치가 찬호의 하강 줄을 조절하고 자신은 발판 위에 남는다. 두 번째 하네스는 원타치의 이동 안전용이다. 작은 복제 주머니가 보인다. / 운송차가 들어와 정차한다. 입구 경비가 메모 번호와 차량 번호를 대조해 막는다. 락스는 밴에서 내려 뒤쪽 방문자 대기 위치에 선다. / 경비가 락스에게 길을 비켜 달라는 손짓을 하자 락스가 기다리며 질문한다. 기사는 확인 전화로 되돌아간다. / 락스가 대기 위치에서 조용히 수신기에 말한다. 기사는 뒤에서 여전히 경비와 확인 중이다." loading="lazy" decoding="async" tabindex="0" data-page="13"></section><section id="page-14" aria-label="49~51컷"><img src="assets/14.webp" width="1024" height="1536" alt="찬호만 천장 점검구에서 내려온다. 줄의 앵커·위 원타치·아래 받침·발과 바닥 사이 간격이 하나의 화면에 있다. / 찬호 두 발은 압력 바닥에 닿지 않는다. 손은 받침 덮개에 닿고 하네스가 몸을 지지한다. / 원타치가 열린 점검구에서 작은 복제 주머니를 내려준다. 찬호가 받아 복제 장갑을 꺼내고 주머니는 허리 주머니에 넣는다." loading="lazy" decoding="async" tabindex="0" data-page="14"></section><section id="page-15" aria-label="52~54컷"><img src="assets/15.webp" width="1024" height="1536" alt="찬호가 투명 덮개를 열고 진품을 받침 위에 둔 채 복제 장갑을 옆에 들어 비교한다. 두 장갑의 크기·형태가 같다. / 복제를 받침에 먼저 대고 진품을 들어 올린다. 한 프레임에 장갑 두 개·찬호 손 두 개·받침 접점만 존재한다. / 찬호가 진품을 허리의 작은 보호 케이스에 넣고 잠금부를 닫는다. 복제는 받침 위에 남아 있다." loading="lazy" decoding="async" tabindex="0" data-page="15"></section><section id="page-16" aria-label="55~57컷"><img src="assets/16.webp" width="1024" height="1536" alt="찬호 손이 덮개를 닫고, 앞서 켜진 황색 표시등이 점멸한다. 광학 검사 빛이 복제의 보석을 비춘다. / 찬호가 황색 등과 위 원타치를 번갈아 본다. 원타치는 회수 장비를 잡고 즉시 당길 준비를 한다. / 빨간 &#x27;보석 인증 실패&#x27; 표시와 경보. 복도 경비의 작은 모니터에도 공중의 찬호가 보이고, 경비가 즉시 무전하며 금고문을 향한다." loading="la
