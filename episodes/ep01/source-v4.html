g="eager" decoding="async"></figure><figure class="panel" id="panel-3" data-panel="3" style="aspect-ratio:724/414;width:100%;margin-top:clamp(12px,4.47368cqw,34px)" aria-label="딱지가 락스에게 출입 규정이 바뀌었다고 무전한다. 락스는 들어갈 수 있겠냐고 묻는다."><img src="/assets/seq01/source-v4/01.png" width="724" height="2172" style="top:-276.08695652%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-4" data-panel="4" style="aspect-ratio:724/615;width:100%;margin-top:clamp(12px,3.15789cqw,24px)" aria-label="딱지가 휴대전화를 꺼내며 배달부터 끝내겠다고 한다."><img src="/assets/seq01/source-v4/01.png" width="724" height="2172" style="top:-253.17073171%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-5" data-panel="5" style="aspect-ratio:725/534;width:100%;margin-top:clamp(12px,15.78947cqw,120px)" aria-label="10분 전 공연장 뒤편 밴. 락스가 장갑 사진을 보여 주며 이번 의뢰의 표적이라고 말한다."><img src="/assets/seq01/source-v4/02.png" width="725" height="2169" style="top:0.00000000%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-6" data-panel="6" style="aspect-ratio:725/523;width:100%;margin-top:clamp(12px,3.15789cqw,24px)" aria-label="희귀 천연 핑크 다이아가 박힌 장갑. 감정가 100억 원이다."><img src="/assets/seq01/source-v4/02.png" width="725" height="2169" style="top:-102.10325048%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-7" data-panel="7" style="aspect-ratio:725/460;width:100%;margin-top:clamp(12px,8.42105cqw,64px)" aria-label="가수가 공연에서 같은 장갑을 착용한다. 앙코르가 끝나면 장갑은 지하 2층 금고로 돌아간다."><img src="/assets/seq01/source-v4/02.png" width="725" height="2169" style="top:-229.78260870%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-8" data-panel="8" style="aspect-ratio:725/652;width:100%;margin-top:clamp(12px,9.47368cqw,72px)" aria-label="금고 도착 후 반출까지 4분 동안 장갑만 가져와야 한다. 락스는 사람을 건드리지 말라고 당부한다."><img src="/assets/seq01/source-v4/02.png" width="725" height="2169" style="top:-232.66871166%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-9" data-panel="9" style="aspect-ratio:725/497;width:100%;margin-top:clamp(12px,4.47368cqw,34px)" aria-label="딱지는 실제 운영팀 주문을 맡았다. 배달을 마치고 직원 통로의 뒷문을 열겠다고 한다."><img src="/assets/seq01/source-v4/03.png" width="725" height="2168" style="top:0.00000000%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-10" data-panel="10" style="aspect-ratio:725/422;width:100%;margin-top:clamp(12px,3.68421cqw,28px)" aria-label="원타치가 종이 포장 젓가락을 오른쪽 안주머니에 챙긴다. 찬호는 문도 부수지 말라고 하고 원타치는 젓가락을 챙기는 중이라고 답한다."><img src="/assets/seq01/source-v4/03.png" width="725" height="2168" style="top:-117.77251185%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-11" data-panel="11" style="aspect-ratio:725/443;width:100%;margin-top:clamp(12px,3.68421cqw,28px)" aria-label="찬호가 치킨 봉투에 손을 뻗자 딱지가 제지한다. 고객님 것이라는 딱지에게 찬호는 냄새만 맡았다고 답한다."><img src="/assets/seq01/source-v4/03.png" width="725" height="2168" style="top:-207.44920993%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-12" data-panel="12" style="aspect-ratio:725/806;width:100%;margin-top:clamp(12px,15.78947cqw,120px)" aria-label="현재 직원 출입구. 딱지가 주문 고객에게 전화해 직원이 동행하면 배달을 안까지 할 수 있다고 설명한다."><img src="/assets/seq01/source-v4/03.png" width="725" height="2168" style="top:-168.98263027%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-13" data-panel="13" style="aspect-ratio:725/539;width:100%;margin-top:clamp(12px,3.15789cqw,24px)" aria-label="주문한 STAFF 직원이 출입증을 걸고 나와 딱지와 함께 들어가자고 한다."><img src="/assets/seq01/source-v4/04.png" width="725" height="2170" style="top:0.00000000%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-14" data-panel="14" style="aspect-ratio:725/482;width:100%;margin-top:clamp(12px,2.63158cqw,20px)" aria-label="경비가 직원의 출입증을 확인하고 휴게실까지만 동행하라고 안내한다."><img src="/assets/seq01/source-v4/04.png" width="725" height="2170" style="top:-111.82572614%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-15" data-panel="15" style="aspect-ratio:725/454;width:100%;margin-top:clamp(12px,5.26316cqw,40px)" aria-label="휴게실에서 딱지가 직원에게 치킨 상자를 전달한다. 직원은 계속 못 먹었다며 반긴다."><img src="/assets/seq01/source-v4/04.png" width="725" height="2170" style="top:-224.88986784%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-16" data-panel="16" style="aspect-ratio:725/695;width:100%;margin-top:clamp(12px,7.36842cqw,56px)" aria-label="직원 통로의 왼쪽은 휴게실, 오른쪽은 후문, 안쪽은 지하 2층 보관실로 이어진다. 딱지가 빈 봉투를 들고 통로로 나온다."><img src="/assets/seq01/source-v4/04.png" width="725" height="2170" style="top:-212.23021583%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-17" data-panel="17" style="aspect-ratio:724/659;width:100%;margin-top:clamp(12px,6.31579cqw,48px)" aria-label="딱지가 안쪽에서 후문을 열고 찬호와 원타치에게 여기가 직원 통로라고 무전한다."><img src="/assets/seq01/source-v4/05.png" width="724" height="2172" style="top:0.00000000%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-18" data-panel="18" style="aspect-ratio:724/316;width:88%;margin-top:clamp(12px,2.89474cqw,22px)" aria-label="작은 검은 고무 문받침. 동료들이 들어올 때까지 문이 닫히지 않게 하려는 것이다."><img src="/assets/seq01/source-v4/05.png" width="724" height="2172" style="top:-208.54430380%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-19" data-panel="19" style="aspect-ratio:724/395;width:94%;margin-top:clamp(12px,1.57895cqw,12px)" aria-label="딱지가 부츠로 고무 문받침을 열린 문 아래에 밀어 넣는다."><img src="/assets/seq01/source-v4/05.png" width="724" height="2172" style="top:-246.83544304%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-20" data-panel="20" style="aspect-ratio:724/802;width:100%;margin-top:clamp(12px,5.26316cqw,40px)" aria-label="열린 후문에서 빛이 골목으로 흐른다. 찬호와 원타치는 바깥 골목에서 문을 향해 접근한다."><img src="/assets/seq01/source-v4/05.png" width="724" height="2172" style="top:-170.82294264%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-21" data-panel="21" style="aspect-ratio:725/612;width:100%;margin-top:clamp(12px,15.78947cqw,120px)" aria-label="휴게실 직원이 배달기사에게 젓가락을 달라고 다시 부른다."><img src="/assets/seq01/source-v4/06.png" width="725" height="2169" style="top:0.00000000%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-22" data-panel="22" style="aspect-ratio:725/450;width:92%;margin-top:clamp(12px,2.10526cqw,16px)" aria-label="딱지가 직원 쪽으로 돌아서며 몸으로 열린 후문 방향을 가린다. 미소가 잠깐 굳는다."><img src="/assets/seq01/source-v4/06.png" width="725" height="2169" style="top:-136.00000000%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-23" data-panel="23" style="aspect-ratio:725/489;width:94%;margin-top:clamp(12px,8.42105cqw,64px)" aria-label="문 밖 원타치가 준비해 둔 종이 포장 젓가락을 오른쪽 안주머니에서 꺼낸다."><img src="/assets/seq01/source-v4/06.png" width="725" height="2169" style="top:-217.17791411%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-24" data-panel="24" style="aspect-ratio:725/618;width:94%;margin-top:clamp(12px,2.63158cqw,20px)" aria-label="원타치가 문틈으로 젓가락을 건네고 딱지가 등 뒤 손으로 받는다. 직원에게는 보이지 않는다."><img src="/assets/seq01/source-v4/06.png" width="725" height="2169" style="top:-250.97087379%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-25" data-panel="25" style="aspect-ratio:725/567;width:100%;margin-top:clamp(12px,2.89474cqw,22px)" aria-label="딱지가 직원에게 젓가락을 건네며 맛있게 드시라고 한다. 직원은 고맙다고 한다."><img src="/assets/seq01/source-v4/07.png" width="725" height="2169" style="top:0.00000000%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-26" data-panel="26" style="aspect-ratio:725/505;width:100%;margin-top:clamp(12px,4.73684cqw,36px)" aria-label="직원이 휴게실로 돌아가 식사한다. 딱지가 동료들에게 지금 들어오라고 조용히 신호한다."><img src="/assets/seq01/source-v4/07.png" width="725" height="2169" style="top:-112.27722772%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-27" data-panel="27" style="aspect-ratio:725/712;width:100%;margin-top:clamp(12px,2.36842cqw,18px)" aria-label="찬호와 원타치가 후문을 넘어 직원 통로에 들어온다. 딱지는 원타치에게 고맙다고 하고 원타치는 다음에는 직접 챙기라고 답한다."><img src="/assets/seq01/source-v4/07.png" width="725" height="2169" style="top:-150.56179775%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-28" data-panel="28" style="aspect-ratio:725/385;width:94%;margin-top:clamp(12px,2.36842cqw,18px)" aria-label="딱지가 안쪽에서 문받침을 회수하고 후문을 닫는다."><img src="/assets/seq01/source-v4/07.png" width="725" height="2169" style="top:-463.37662338%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-29" data-panel="29" style="aspect-ratio:725/540;width:100%;margin-top:clamp(12px,11.84211cqw,90px)" aria-label="딱지가 직원 출입구를 통해 밖으로 나와 밴에 복귀한다. 두 사람이 들어갔다고 락스에게 보고한다."><img src="/assets/seq01/source-v4/08.png" width="725" height="2169" style="top:0.00000000%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-30" data-panel="30" style="aspect-ratio:725/563;width:100%;margin-top:clamp(12px,15.78947cqw,120px)" aria-label="찬호와 원타치가 지하 2층 보관실 계단을 내려간다."><img src="/assets/seq01/source-v4/08.png" width="725" height="2169" style="top:-95.91474245%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-31" data-panel="31" style="aspect-ratio:725/461;width:100%;margin-top:clamp(12px,12.63158cqw,96px)" aria-label="빈 운반 케이스를 든 반출팀이 지하 보안 구역에 먼저 와 있다. 찬호가 락스에게 무전한다."><img src="/assets/seq01/source-v4/08.png" width="725" height="2169" style="top:-239.26247289%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure><figure class="panel" id="panel-32" data-panel="32" style="aspect-ratio:725/605;width:100%;margin-top:clamp(12px,8.42105cqw,64px)" aria-label="두 사람은 계단 그림자에서 반출팀을 관찰한다. 앙코르도 끝나기 전에 반출팀이 왔다. 락스는 금고로 향하라고 지시한다."><img src="/assets/seq01/source-v4/08.png" width="725" height="2169" style="top:-258.51239669%" alt="" aria-hidden="true" loading="eager" decoding="async"></figure></main><footer><p>시퀀스 1 · 원본 개작본</p><a href="#panel-1">맨 위로 ↑</a></footer></body></html>
