utton id="more" aria-label="확대">+</button><button id="close">닫기</button></div><div class="zoom"><img id="zoom-image" alt=""></div></dialog><script>const dlg=document.getElementById('enlarge'),zi=document.getElementById('zoom-image'),label=document.getElementById('page-label');let scale=1;function openImage(im){zi.src=im.src;zi.alt=im.alt;label.textContent=im.dataset.page+'페이지';scale=1;zi.style.width='100%';dlg.showModal()}document.querySelectorAll('main img').forEach(im=>{im.onclick=()=>openImage(im);im.onkeydown=e=>{if(e.key==='Enter')openImage(im)}});document.getElementById('more').onclick=()=>{scale=Math.min(3,scale+.5);zi.style.width=(scale*100)+'%'};document.getElementById('less').onclick=()=>{scale=Math.max(1,scale-.5);zi.style.width=(scale*100)+'%'};document.getElementById('close').onclick=()=>dlg.close();</script></body></html>
