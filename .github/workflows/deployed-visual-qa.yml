name: Deployed Visual QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Cloudflare deployment
        run: |
          for i in {1..48}; do
            page="$(curl -fsS "https://desperado-moving-webtoon.ktsjjcap.workers.dev/episodes/ep01/pilot?qa=${GITHUB_SHA}" || true)"
            video_status="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1' "https://desperado-moving-webtoon.ktsjjcap.workers.dev/assets/ep01-video/sc00.mp4?qa=${GITHUB_SHA}" || true)"
            if [[ "$page" == *'/assets/pilot-v2.js'* ]] && [[ "$video_status" == "200" || "$video_status" == "206" ]]; then
              sleep 5
              exit 0
            fi
            sleep 5
          done
          exit 1
      - run: npm run qa
        env:
          QA_URL: https://desperado-moving-webtoon.ktsjjcap.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-visual-qa-${{ github.sha }}
          path: |
            qa-evidence
            qa-report
            test-results
          if-no-files-found: warn
